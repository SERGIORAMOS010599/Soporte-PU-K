<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Importar Chart.js para las gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte PU-K - IDT Tecnologías</title>
    <link rel="stylesheet" href="soporte.css">
    
    <!-- ESTILOS DE LOS NUEVOS MONITORES OOP -->
    <link rel="stylesheet" href="css/monitormapon.css">
    <link rel="stylesheet" href="css/monitorzeek.css">
    
    <style>
        .dashboard-monitores {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
    </style>
    
    <!-- DETECTOR DE ERRORES EN PANTALLA -->
    <script>
        window.onerror = function(msg, url, line) {
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = "background:red; color:white; padding:20px; font-weight:bold; text-align:center; position:fixed; top:0; width:100%; z-index:9999;";
            errorDiv.innerText = `¡ERROR DETECTADO! Archivo: ${url.split('/').pop()} | Línea: ${line} | Detalle: ${msg}`;
            document.body.appendChild(errorDiv);
        };
    </script>
</head>
<body>
    
    <!-- NUEVA BARRA DE NAVEGACIÓN (Pestañas y Buscador Universal) -->
    <div class="navbar-principal" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1a1a1a; border-bottom: 2px solid #ffb74d;">
        
        <div style="display: flex; align-items: center; gap: 30px;">
            <div class="logo-app" style="color: #ffb74d; font-weight: bold; font-size: 1.2rem;">IDT TECNOLOGÍAS - PU-K</div>
            <div class="menu-tabs" style="display: flex; gap: 10px;">
                <button class="tab-btn activo" onclick="appSoporte.cambiarVista('soporte')">Soporte Técnico</button>
                <button class="tab-btn" onclick="appSoporte.cambiarVista('monitores')">Monitores Globales</button>
                <button class="tab-btn" onclick="appSoporte.cambiarVista('diagnostico')">Diagnóstico en Vivo</button>
            </div>
        </div>

        <!-- BARRA DE BÚSQUEDA UNIVERSAL MOVIDA AQUÍ -->
        <div class="buscador-container" style="position: relative; min-width: 300px;">
            <input type="text" id="buscador-global" placeholder="Buscar por IMEI, ID, Cliente o Unidad..." oninput="appSoporte.buscarGlobal(this.value)" style="width: 100%; padding: 10px 35px 10px 15px; border-radius: 20px; border: 1px solid #444; background: #222; color: #fff;">
            <span id="btn-limpiar-busqueda" onclick="appSoporte.limpiarBusqueda()" style="display: none; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #ffb74d; font-weight: bold;">✖</span>
        </div>

    </div>

    <!-- CONTENEDOR DE VISTAS (Alterna entre Soporte, Monitores y Diagnóstico) -->
    <div class="vistas-container">
        
        <!-- ========================================== -->
        <!-- VISTA 1: SOPORTE TÉCNICO (Tu vista original) -->
        <!-- ========================================== -->
        <div id="vista-soporte" class="vista-activa">

            <!-- CUADRÍCULA MAESTRA -->
                <div class="vista-cuadricula" style="overflow-y: auto; max-height: calc(100vh - 120px); padding-bottom: 20px; padding-right: 10px;">
                    <div id="grid-salidas" class="grid-tarjetas"></div>
                </div>

                <!-- PANEL DE DETALLES -->
                <div id="panel-detalles" class="panel-lateral">
                    <div class="encabezado-panel">
                        <div id="det-titulo-contenedor" style="display: flex; align-items: center; gap: 10px;">
                            <h1 class="titulo-detalles" id="det-titulo">CARGANDO...</h1>
                            <span class="icono-editar" onclick="appSoporte.activarEdicionGeneral()">✏️</span>
                        </div>
                        <button class="btn-cerrar" onclick="appSoporte.cerrarDetalles()">✖</button>
                    </div>
                    
                    <div class="panel-botones" style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
                        <button class="btn-accion" onclick="appSoporte.enviarSMS('apagar')">
                            <div class="icono" style="background-color: #d32f2f;">⏻</div>APAGAR<br>MOTOR
                        </button>
                        <button class="btn-accion" onclick="appSoporte.enviarSMS('encender')">
                            <div class="icono" style="background-color: #388e3c;">⏻</div>ENCENDER<br>MOTOR
                        </button>
                        <button class="btn-accion" onclick="appSoporte.enviarSMS('configuracion')">
                            <div class="icono" style="background-color: #ffb74d;">?</div>CONFIGURACION<br>DEL EQUIPO
                        </button>
                        <button class="btn-accion" onclick="appSoporte.enviarSMS('reiniciar')">
                            <div class="icono" style="background-color: #f57c00;">⟳</div>REINICIAR<br>EQUIPO
                        </button>
                        <button class="btn-accion" onclick="appSoporte.enviarSMS('borrar')">
                            <div class="icono" style="background-color: #f57c00;">🗑️</div>BORRADO DE<br>MEMORIA
                        </button>
                        <button class="btn-accion" onclick="appSoporte.enviarSMS('formatear')">
                            <div class="icono" style="background-color: #d32f2f;">⌫</div>FORMATEAR<br>EQUIPO
                        </button>
                        <button class="btn-accion" onclick="window.open('https://soporte.zeekgps.com/ZeekSoporte/', '_blank')">
                            <div class="icono" style="background-color: #1976d2;">🛠️</div>ZEEK<br>SOPORTE
                        </button>
                        <button class="btn-accion" onclick="window.open('https://mapon.com/partner/gbox_new/', '_blank')">
                            <div class="icono" style="background-color: #00c853;">📍</div>MAPON<br>SOPORTE
                        </button>
                        <button class="btn-accion" onclick="appSoporte.abrirDiagnostico()">
                            <div class="icono" style="background-color: #9c27b0;">🩺</div>DIAGNÓSTICO<br>EN VIVO
                        </button>
                    </div>
                    
                    <table class="tabla-info">
                        <tr><td>ID</td><td id="det-id">---</td></tr>
                        <tr><td>Línea</td><td id="det-linea">---</td></tr>
                        <tr><td>ICCID</td><td id="det-iccid">---</td></tr>
                        <tr><td>IMEI</td><td id="det-imei">---</td></tr>
                        <tr><td>Marca</td><td id="det-marca">---</td></tr>
                        <tr><td>Modelo</td><td id="det-modelo">---</td></tr>
                        <tr><td>Cliente</td><td id="det-cliente">---</td></tr>
                        <tr><td>Tipo de servicio</td><td id="det-tipo-servicio" style="text-transform: uppercase; font-weight: bold;">---
