<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte PU-K</title>
    <link rel="stylesheet" href="soporte.css">
    
    <!-- DETECTOR DE ERRORES EN PANTALLA -->
    <script>
        window.onerror = function(msg, url, line) {
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = "background:red; color:white; padding:20px; font-weight:bold; text-align:center; position:fixed; top:0; width:100%; z-index:9999;";
            errorDiv.innerText = `¡ERROR DETECTADO! Archivo: ${url.split('/').pop()} | Línea: ${line} | Detalle: ${msg}`;
            document.body.appendChild(errorDiv);
        };
    </script>
</head>
<body>

    <!-- BARRA DE BÚSQUEDA UNIVERSAL -->
    <div class="buscador-container" style="position: relative; max-width: 600px; margin: 0 auto; padding: 20px;">
        <input type="text" id="buscador-global" placeholder="Buscar por IMEI, ID, Cliente o Unidad..." oninput="appSoporte.buscarGlobal(this.value)">
        <span id="btn-limpiar-busqueda" onclick="appSoporte.limpiarBusqueda()" style="display: none; position: absolute; right: 30px; top: 35px; cursor: pointer; color: #a0a0a0;">✖</span>
    </div>

    <div class="barra-superior">
        SOPORTE TÉCNICO
    </div>

    <div class="contenedor-principal">
        
        <!-- CUADRÍCULA MAESTRA -->
        <div class="vista-cuadricula">
            <div id="grid-salidas" class="grid-tarjetas"></div>
        </div>

        <!-- PANEL DE DETALLES -->
        <div id="panel-detalles" class="panel-lateral">
            <div class="encabezado-panel">
                <!-- TÍTULO Y LÁPIZ MAESTRO -->
                <div id="det-titulo-contenedor" style="display: flex; align-items: center; gap: 10px;">
                    <h1 class="titulo-detalles" id="det-titulo">CARGANDO...</h1>
                    <span class="icono-editar" onclick="appSoporte.activarEdicionGeneral()">✏️</span>
                </div>
                <button class="btn-cerrar" onclick="appSoporte.cerrarDetalles()">✖</button>
            </div>
            
            <!-- BOTONES DE ACCIÓN RÁPIDA -->
            <div class="panel-botones" style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
                <button class="btn-accion" onclick="appSoporte.enviarSMS('apagar')">
                    <div class="icono" style="background-color: #d32f2f;">⏻</div>APAGAR<br>MOTOR
                </button>
                <button class="btn-accion" onclick="appSoporte.enviarSMS('encender')">
                    <div class="icono" style="background-color: #388e3c;">⏻</div>ENCENDER<br>MOTOR
                </button>
                <button class="btn-accion" onclick="appSoporte.enviarSMS('configuracion')">
                    <div class="icono" style="background-color: #ffb74d;">?</div>CONFIGURACION<br>DEL EQUIPO
                </button>
                <button class="btn-accion" onclick="appSoporte.enviarSMS('reiniciar')">
                    <div class="icono" style="background-color: #f57c00;">⟳</div>REINICIAR<br>EQUIPO
                </button>
                <button class="btn-accion" onclick="appSoporte.enviarSMS('borrar')">
                    <div class="icono" style="background-color: #f57c00;">🗑️</div>BORRADO DE<br>MEMORIA
                </button>
                <button class="btn-accion" onclick="appSoporte.enviarSMS('formatear')">
                    <div class="icono" style="background-color: #d32f2f;">⌫</div>FORMATEAR<br>EQUIPO
                </button>
                <button class="btn-accion" onclick="window.open('https://soporte.zeekgps.com/ZeekSoporte/', '_blank')">
                    <div class="icono" style="background-color: #1976d2;">🛠️</div>ZEEK<br>SOPORTE
                </button>
                <button class="btn-accion" onclick="window.open('https://mapon.com/partner/gbox_new/', '_blank')">
                    <div class="icono" style="background-color: #00c853;">📍</div>MAPON<br>SOPORTE
                </button>
                <button class="btn-accion" onclick="appSoporte.abrirDiagnostico()">
                    <div class="icono" style="background-color: #9c27b0;">🩺</div>DIAGNÓSTICO<br>EN VIVO
                </button>
            </div>
            
            <table class="tabla-info">
                <tr><td>ID</td><td id="det-id">---</td></tr>
                <tr><td>Línea</td><td id="det-linea">---</td></tr>
                <tr><td>ICCID</td><td id="det-iccid">---</td></tr>
                <tr><td>IMEI</td><td id="det-imei">---</td></tr>
                <tr><td>Marca</td><td id="det-marca">---</td></tr>
                <tr><td>Modelo</td><td id="det-modelo">---</td></tr>
                <tr><td>Cliente</td><td id="det-cliente">---</td></tr>
                <tr><td>Tipo de servicio</td><td id="det-tipo-servicio" style="text-transform: uppercase; font-weight: bold;">---</td></tr>
                <tr><td>Estado del Servicio</td><td id="det-servicio">---</td></tr>
                <!-- NUEVAS COLUMNAS -->
                <tr><td>Marca/Mod. Unidad</td><td id="det-marcaModeloUnidad">---</td></tr>
                <tr><td>Año Unidad</td><td id="det-anio">---</td></tr>
                <tr><td>Nº Serie Unidad</td><td id="det-numSerie">---</td></tr>
            </table>

            <!-- PANEL DE COMANDOS -->
            <div class="panel-comandos-box">
                <div class="comandos-header">
                    <h3>Panel de comandos <span class="badge">0</span></h3>
                </div>
                <div class="comandos-body">
                    <p>No objetos</p>
                </div>
                <div class="comandos-footer">
                    <button class="btn-texto-dorado" onclick="appSoporte.abrirModalComandos()">AGREGAR COMANDO</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- MODAL FORMULARIO DE COMANDOS -->
    <div id="modal-comandos" class="modal-oscuro">
        <div class="modal-comandos-content">
            <div class="modal-cmd-header">
                <h2>✕ Comandos Form</h2>
                <div>
                    <button class="btn-cancelar" onclick="appSoporte.cerrarModalComandos()">Cancelar</button>
                    <button class="btn-guardar">Guardar</button>
                </div>
            </div>
            <div class="modal-cmd-body">
                <div class="form-grupo"><label>MARCA</label><input type="text" id="cmd-marca" readonly></div>
                <div class="form-grupo"><label>MODELOS</label><input type="text" id="cmd-modelo" readonly></div>
                <div class="form-grupo"><label>ID</label><input type="text" id="cmd-id" readonly></div>
                <div class="form-grupo">
                    <label>TIPO DE COMANDO</label>
                    <select id="cmd-tipo" onchange="appSoporte.cambiarTipoComando()">
                        <option value="">Buscar</option>
                        <option value="puertos">PUERTOS, IP's y APN'S</option>
                        <option value="fuel">PROGRAMACION FUEL</option>
                        <option value="driving">PROGRAMACION DRIVING</option>
                        <option value="cero">PROGRAMACION DESDE 0</option>
                    </select>
                </div>
                <!-- SECCIÓN DINÁMICA (Se muestra al elegir un tipo) -->
                <div id="cmd-seccion-dinamica" style="display: none;">
                    <div class="form-grupo">
                        <label>LINEA DE TRAMA</label>
                        <input type="text" id="cmd-trama" oninput="appSoporte.procesarComando()">
                    </div>
                    <div class="form-grupo">
                        <label>COMANDOS</label>
                        <div class="comando-resultado" id="cmd-resultado">NO HAY MAS CODIGOS!! 📋</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Carga del Cerebro OOP -->
    <script src="comandos.js"></script>
   <script src="soporte.js?v=2"></script>
</body>
</html>
